name: Build ShikshaSetu Offline APK

on:
  push:
    branches:
      - offline-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Assemble Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/ShikshaSetu-offline.apk
          echo "APK successfully built: release/ShikshaSetu-offline.apk"
          ls -lh release/ShikshaSetu-offline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShikshaSetu-offline.apk
          path: release/ShikshaSetu-offline.apk
          if-no-files-found: error
          retention-days: 30
