name: Release ShikshaSetu Offline APK

on:
  push:
    tags:
      - 'offline-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --prefer-offline || npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Assemble Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/ShikshaSetu-offline.apk
          echo "APK successfully built: release/ShikshaSetu-offline.apk"
          ls -lh release/ShikshaSetu-offline.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/ShikshaSetu-offline.apk
          name: ShikshaSetu Offline Tablet Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ShikshaSetu Offline Android APK
            
            Installable Android Tablet app designed for Mother-Tongue First Foundational Literacy & Numeracy (FLN) in Jharkhand classrooms under NEP 2020.
            
            ### Included Offline Capabilities:
            - **FLN Lesson Studio**: Grades 1-3 curriculum in Hindi ↔ Santali (Ol Chiki), Ho, Mundari.
            - **Aadi Vaani Classroom Voice**: Constrained phrasebook with zero network latency & preloaded teacher audio.
            - **NIPUN Bharat Worksheets**: Complete local worksheet generation for competencies L1.1 through M3.1 with instant PDF export.
            - **Bilingual Flashcards**: 48+ tactile vocabulary flashcards.
            - **Teacher Pedagogy Mentor**: Structured pedagogical guidance, oral questions, and remediation actions.
            - **Offline Dashboard**: Local competency mastery & translation memory stored directly on device.
            
            ### Download:
            Download `ShikshaSetu-offline.apk` below and install directly onto any Android 9+ tablet.
